# git-cliff configuration for Cronduit changelog generation.
# Used by .github/workflows/release.yml via orhun/git-cliff-action.

[changelog]
header = """
# Changelog\n
All notable changes to Cronduit are documented here.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {# unique(attribute="message") drops repeated lines: a squash merge's body can repeat its title as a bullet #}
    {% for commit in commits | unique(attribute="message") %}
        - {% if commit.scope %}*({{ commit.scope }})*: {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Split each squash-merge body into its own commits. GitHub squash merges put
# the real `feat(...)`/`fix(...)` lines in the body as `* ` bullets, which
# are otherwise invisible to the subject-only parser.
split_commits = true
# Rewrite non-conventional squash-merge titles so git-cliff's conventional
# parser accepts them. Cronduit ships one `Phase N: ...` squash-merge per
# executed GSD phase (e.g. `Phase 12: Docker Healthcheck + rc.1 Cut (#29)`)
# and `Milestone vX.Y: ...` squash-merges for milestone-level PRs — neither
# is conventional-commits form, so without these preprocessors git-cliff
# silently drops them and rc release notes come out near-empty.
commit_preprocessors = [
    # Strip the GitHub squash-merge bullet so `* feat(x): y` parses as `feat(x): y`.
    { pattern = "(?m)^\\* ", replace = "" },
    { pattern = "^(Phase \\d+: .*)", replace = "feat: $1" },
    { pattern = "^(Milestone .*)", replace = "feat: $1" },
    # split_commits treats every body line as a commit, and a line that looks like
    # `word: ...` but has an unknown type inherits the parent commit's group. So
    # keep only known conventional types: mark them, drop every other
    # `word:`/`word(scope):` line (trailers like Co-Authored-By and Claude-Session,
    # wrapped prose like `telemetry::foo ...`), then remove the marker.
    { pattern = "(?m)^((feat|fix|refactor|perf|test|docs|ci|chore|style|build|revert)(\\([^)\\n]*\\))?!?:)", replace = "@@cc@@$1" },
    { pattern = "(?m)^[A-Za-z][\\w.-]*(\\([^)\\n]*\\))?!?:.*$", replace = "" },
    { pattern = "(?m)^@@cc@@", replace = "" },
]
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^refactor", group = "Refactor" },
    { message = "^perf", group = "Performance" },
    { message = "^test", group = "Testing" },
    { message = "^docs", group = "Documentation" },
    { message = "^ci", group = "CI/CD" },
    { message = "^chore", skip = true },
    { message = "^style", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
